<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b14" />
  <!--meta-->
  <title>Find time to hang · Boofer's Den</title>
  <meta name="description" content="Make a scheduler, share the link, and everyone taps their name and says when they're usually free. The best times float to the top. No logins." />
  <meta property="og:site_name" content="Boofer's Den" />
  <meta property="og:title" content="Find time to hang" />
  <meta property="og:description" content="Make a scheduler, share the link, and everyone taps their name and says when they're usually free. No logins." />
  <meta property="og:type" content="website" />
  <!--/meta-->
  <link rel="stylesheet" href="/hang/app.css" />
</head>
<body>
  <header class="bar">
    <a class="home" href="/">&larr; Den</a>
    <a class="brand" href="/hang/"><span aria-hidden="true">&#x1F5D3;&#xFE0F;</span> Find time to hang</a>
  </header>

  <main id="create-view" class="wrap" hidden></main>
  <main id="event-view" class="wrap" hidden></main>
  <main id="missing" class="wrap" hidden>
    <section class="card"><h1>That scheduler&rsquo;s gone</h1><p>It may have expired (90 days after the last change) or the link is off. <a href="/hang/">Make a new one</a>.</p></section>
  </main>

  <nav id="dock" class="dock" hidden>
    <button type="button" class="btn primary" id="dock-me">Fill in my times</button>
    <button type="button" class="btn" id="dock-share">Share</button>
  </nav>
  <div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/hang/engine.js"></script>
  <script src="/hang/app.js"></script>
</body>
</html>
