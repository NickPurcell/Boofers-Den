<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoloTable | Boofer's Den</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%234fc3f7' stroke-width='3'/><circle cx='16' cy='16' r='5' fill='%23ffb74d'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============ LOBBY ============ -->
  <section id="lobby" class="screen">
    <div class="lobby-inner">
      <h1 class="logo">HOLO<span>TABLE</span></h1>
      <p class="tag">jpesus's Star Wars 5e campaign table · <a href="../">&larr; back to jpesus's corner</a></p>
      <form class="card signin" id="loginForm">
        <h2>Sign in to the table</h2>
        <p class="muted">Use the password your GM gave you. The GM signs in with the GM password.</p>
        <label>Your name<input name="name" required maxlength="40" autocomplete="nickname" placeholder="Kira"></label>
        <label>Password<input name="password" type="password" required maxlength="200" autocomplete="current-password"></label>
        <button class="btn primary" type="submit">Enter</button>
      </form>
      <p id="lobbyError" class="error"></p>
    </div>
  </section>

  <!-- ============ TABLE ============ -->
  <section id="table" class="screen hidden">
    <header class="topbar">
      <div class="brand">HOLO<span>TABLE</span></div>
      <div class="camp"><span id="campName"></span></div>
      <div id="online" class="online"></div>
      <div class="spacer"></div>
      <div class="rollmode" title="Applies to d20 rolls. Shortcut: Shift-click = advantage, Ctrl-click = disadvantage">
        <button data-mode="dis">Dis</button><button data-mode="normal" class="on">Normal</button><button data-mode="adv">Adv</button>
      </div>
      <label class="toggle" title="Only you and the GM see your rolls"><input type="checkbox" id="privateRolls"> GM-only rolls</label>
      <button id="themeBtn" class="btn small ghost" title="Your colours">🎨</button>
      <button id="lvlBtn" class="btn small amber gm-only" title="Give characters a new level">⬆ Level Up</button>
      <span id="conn" class="conn" title="Connection"></span>
      <button id="leaveBtn" class="btn small ghost">Sign out</button>
    </header>

    <div id="missingBar" class="missing-bar hidden" role="alert"></div>
    <div class="layout">
      <aside class="roster">
        <div class="roster-head">
          <h3>Characters</h3>
          <div class="row">
            <button class="btn small primary" id="importBtn" title="Upload a character from the SW5e character builder">⇪ Upload sheet</button>
            <button class="btn small" id="newCharBtn">＋ New</button>
          </div>
          <input type="file" id="importFile" accept=".json,application/json" multiple hidden>
        </div>
        <div id="charList" class="char-list"></div>
        <div class="drop-hint">Drop a sheet .json here</div>
      </aside>

      <main class="center">
        <nav class="tabs" id="tabs">
          <button data-tab="sheet" class="on">Sheet</button>
          <button data-tab="map">Map</button>
          <button data-tab="combat">Combat</button>
          <button data-tab="ships">Ships</button>
          <button data-tab="handouts">Handouts</button>
          <button data-tab="rules">Rules</button>
          <button data-tab="gm" class="gm-only">GM</button>
        </nav>
        <div class="tabpanes">
          <div class="pane on" id="pane-sheet"><div id="sheet"></div></div>
          <div class="pane" id="pane-map">
            <div class="map-tools" id="mapTools"></div>
            <div class="map-body">
              <div class="map-wrap" id="mapWrap"><canvas id="mapCanvas"></canvas></div>
              <aside class="asset-drawer hidden" id="assetDrawer"></aside>
            </div>
          </div>
          <div class="pane" id="pane-combat"><div id="combat"></div></div>
          <div class="pane" id="pane-ships"><div id="ships"></div></div>
          <div class="pane" id="pane-handouts"><div id="handouts"></div></div>
          <div class="pane" id="pane-rules"><div id="rules"></div></div>
          <div class="pane" id="pane-gm"><div id="gm"></div></div>
        </div>
      </main>

      <aside class="chat">
        <div id="chatLog" class="chat-log"></div>
        <form id="chatForm" class="chat-form">
          <div id="cmdMenu" class="cmd-menu hidden" role="listbox" aria-label="Chat commands"></div>
          <div class="quick-dice" id="quickDice"></div>
          <div class="row">
            <input id="chatInput" autocomplete="off" placeholder="Message, or type / for commands" aria-controls="cmdMenu" aria-autocomplete="list">
            <button class="btn primary small" type="submit">Send</button>
          </div>
        </form>
      </aside>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast"></div>

  <script src="themes.js"></script>
  <script src="rules.js"></script>
  <script src="importer.js"></script>
  <script src="packs.js"></script>
  <script src="app.js"></script>
  <script src="books.js"></script>
</body>
</html>
