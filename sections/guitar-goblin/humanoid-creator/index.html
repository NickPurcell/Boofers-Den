<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Character creator: moved</title>
  <link rel="canonical" href="../characters/" />
  <script>
    // The character creator now lives at ../characters/. A link to this page keeps its species (#species=...); the
    // other choices in an old link were the earlier page's and do not carry over. The earlier page is at classic.html.
    (function () {
      var q = new URLSearchParams(location.hash.slice(1)), sp = q.get('species'), ok = ['pureblood', 'human', 'echani', 'mirialan', 'mikkian'];
      location.replace('../characters/' + (sp && ok.indexOf(sp) >= 0 ? '#species=' + sp : ''));
    })();
  </script>
  <style>body { background: #0e1420; color: #edf2f8; font: 16px/1.5 system-ui, sans-serif; padding: 2rem; } a { color: #5fa8d8; }</style>
</head>
<body>
  <p>The character creator has moved to <a href="../characters/">its new page</a>. The earlier version is still <a href="classic.html">here</a> for a while.</p>
</body>
</html>
