  <link rel="stylesheet" href="backrooms/wiki.css" />
</head>
<body>
  <div class="ceiling" aria-hidden="true"></div>
  <div class="wrap">
    <header class="hero">
      <p class="kicker">Moved</p>
      <h1>This became a wiki.</h1>
      <p class="lede">The plan outgrew one page. It now lives at
        <a href="backrooms/">/sections/guitar-goblin/backrooms/</a>, and you should be sent there
        automatically.</p>
    </header>
    <p><a href="backrooms/">Go to the Backrooms wiki &rarr;</a></p>

</html>
